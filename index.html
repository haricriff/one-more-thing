<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter For You 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--fs:24px;--lh:34px;--bg:#fde8ee;--env:#f4b6c6;--env2:#eaa0b4;--paper:#fffdf6;--ink:#2b3a67;--line:#e3dccb;--accent:#e0446a;--text:#4a2a35}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--env:#c9718a;--env2:#b85f79;--paper:#fbf6e9;--ink:#243158;--line:#ddd3bb;--accent:#ff7a9b;--text:#f6d8e0}}
:root[data-theme="dark"]{--bg:#2a1620;--env:#c9718a;--env2:#b85f79;--paper:#fbf6e9;--ink:#243158;--line:#ddd3bb;--accent:#ff7a9b;--text:#f6d8e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:'Caveat','Bradley Hand','Segoe Script',cursive;color:var(--text);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:900px}
.hint{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-size:26px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
#env{position:relative;width:min(84vw,340px);height:min(56vw,226px);background:var(--env);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer;transition:transform .8s ease,opacity .6s;animation:float 3s ease-in-out infinite;transform-style:preserve-3d}
@keyframes float{50%{transform:translateY(-8px)}}
#env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,transparent 49.5%,var(--env2) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,var(--env2) 50%) right/50% 100% no-repeat;z-index:3}
#flap{position:absolute;top:0;left:0;width:100%;height:60%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:4}
#seal{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:34px;z-index:5;transition:opacity .3s}
#env.open{animation:none}
#env.open #flap{transform:rotateX(180deg);z-index:1}
#env.open #seal{opacity:0}
#env.gone{transform:translateY(60vh);opacity:0;pointer-events:none}
#mini{position:absolute;left:6%;right:6%;top:8%;height:80%;background:var(--paper);border-radius:6px;z-index:2;transition:transform .9s ease .5s,opacity .4s ease 1.3s}
#env.open #mini{transform:translateY(-60%);opacity:0}
#letter{position:absolute;width:min(92vw,400px);height:min(84vh,640px);background:var(--paper);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:16px 18px 20px 34px;transform:translateY(110vh) rotate(-4deg) scale(.7);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.3,1.1),opacity .5s;overflow:hidden;color:var(--ink);
background-image:linear-gradient(90deg,transparent 24px,#f0a0a0 24px,#f0a0a0 25px,transparent 25px),repeating-linear-gradient(transparent,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));background-position:0 0,0 16px}
#letter.show{transform:none;opacity:1}
#badge{position:absolute;top:10px;right:14px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center;transform:rotate(12deg);box-shadow:0 3px 8px rgba(0,0,0,.25)}
#msg{font-size:var(--fs);line-height:var(--lh);font-weight:500;white-space:pre-wrap;margin:0;padding-top:0}
#msg .title{font-size:calc(var(--fs)*1.2);display:inline-block;padding-right:52px;font-weight:700;color:var(--accent)}
.ghost{visibility:hidden}.cur{display:inline-block;width:2px;height:24px;background:var(--ink);vertical-align:-3px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
#replay{position:static;display:block;margin:8px 0 0 auto;font:700 22px 'Caveat',cursive;background:var(--accent);color:#fff;border:0;border-radius:20px;padding:6px 16px;opacity:0;pointer-events:none;transition:opacity .5s}
#replay.show{opacity:1;pointer-events:auto}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="stage">
  <div id="env"><div id="mini"></div><div id="flap"></div><div id="seal">❤️</div></div>
  <div class="hint" id="hint">Tap the envelope 💌</div>
  <div id="letter"><div id="badge">18</div><p id="msg"></p><button id="replay">Read again ↺</button></div>
</div>
<canvas id="c"></canvas>
<script>
// ✏️ EDIT THESE: or share a link like ...?to=Anu&from=Ravi&age=7
var TEXT="Happy 18th Birthday to one of the most special people in my life! ❤️🎂🥳\n\nToday is such a special day because you’re finally 18! 🥹 I’m really happy and grateful that I got to know you and have you in my life.\n\nI hope this new chapter brings you lots of happiness, beautiful memories, success, and everything you wish for. You deserve so many good things in life. ❤️\n\nThank you for always being such a wonderful friend. Please keep smiling, stay happy, and never change the beautiful person you are.\n\nEnjoy your special day to the fullest! 🎉🎂❤️\n\nHappy 18th Birthday once again! 🥳❤️";
var env=document.getElementById('env'),letter=document.getElementById('letter'),msg=document.getElementById('msg'),hint=document.getElementById('hint'),rb=document.getElementById('replay');
var busy=false,timer;
function render(n,cur){
  var full=TEXT,nl=full.indexOf('\n'),hl=nl<0?full.length:nl;
  var typed=full.slice(0,n),rest=full.slice(n);
  var h=n<=hl?typed:full.slice(0,hl),hr=n<=hl?full.slice(n,hl):'';
  var body=n<=hl?'':typed.slice(hl);
  var tail=n<=hl?full.slice(hl):rest;
  msg.innerHTML='<span class="title">'+esc(h)+(cur&&n<=hl?'<span class="cur"></span>':'')+'<span class="ghost">'+esc(hr)+'</span></span>'+esc(body)+(cur&&n>hl?'<span class="cur"></span>':'')+'<span class="ghost">'+esc(tail)+'</span>';
}
function fit(){
  for(var fs=26;fs>=10;fs-=.5){
    document.documentElement.style.setProperty('--fs',fs+'px');
    document.documentElement.style.setProperty('--lh',(fs*1.45)+'px');
    render(0,false);
    if(letter.scrollHeight<=letter.clientHeight+1)break;
  }
}
function type(){
  fit();rb.classList.remove('show');
  var i=0;
  (function step(){
    render(i,true);
    if(i<TEXT.length){i++;timer=setTimeout(step,/[.!,\n]/.test(TEXT[i-1])?200:40)}
    else{render(TEXT.length,false);rb.classList.add('show');confetti()}
  })();
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function openIt(){
  if(busy)return;busy=true;hint.style.display='none';
  env.classList.add('open');
  setTimeout(function(){env.classList.add('gone')},1500);
  setTimeout(function(){letter.classList.add('show')},1700);
  setTimeout(type,2800);
}
env.addEventListener('click',openIt);
rb.addEventListener('click',function(){clearTimeout(timer);type()});
// confetti
var cv=document.getElementById('c'),cx=cv.getContext('2d'),P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(){
  var cols=['#ff5d8f','#ffd23f','#3bceac','#5b8def','#b06cff'];
  for(var i=0;i<140;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,r:4+Math.random()*6,c:cols[i%5],vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,va:.1+Math.random()*.2});
  if(!run){run=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return p.y<cv.height+20});
  P.forEach(function(p){p.y+=p.vy;p.x+=p.vx+Math.sin(p.a);p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  if(P.length)requestAnimationFrame(loop);else run=false;
}
</script>
</body>
</html>
